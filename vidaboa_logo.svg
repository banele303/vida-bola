<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Modern Minimalist Single-Color Emerald Farm Emblem (Transparent Background, No Padding) -->
  <defs>
    <style>
      .brand-stroke { stroke: #2ecc71; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .brand-fill { fill: #2ecc71; }
      .brand-text { font-family: 'Outfit', 'Segoe UI', -apple-system, sans-serif; fill: #2ecc71; text-anchor: middle; }
    </style>
  </defs>

  <!-- Outer Geometric Minimalist Ring -->
  <circle cx="250" cy="250" r="236" class="brand-stroke" stroke-width="8"/>
  <circle cx="250" cy="250" r="218" class="brand-stroke" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- Cardinal Star Accents -->
  <polygon points="250,22 254,32 250,42 246,32" class="brand-fill"/>
  <polygon points="250,458 254,468 250,478 246,468" class="brand-fill"/>
  <polygon points="22,250 32,246 42,250 32,254" class="brand-fill"/>
  <polygon points="458,250 468,246 478,250 468,254" class="brand-fill"/>

  <!-- Central Rising Sun Arc & Geometric Rays -->
  <path d="M 180 180 A 75 75 0 0 1 320 180" class="brand-stroke" stroke-width="5"/>
  <line x1="250" y1="90" x2="250" y2="65" class="brand-stroke" stroke-width="5"/>
  <line x1="210" y1="102" x2="192" y2="82" class="brand-stroke" stroke-width="5"/>
  <line x1="290" y1="102" x2="308" y2="82" class="brand-stroke" stroke-width="5"/>
  <line x1="175" y1="135" x2="152" y2="122" class="brand-stroke" stroke-width="5"/>
  <line x1="325" y1="135" x2="348" y2="122" class="brand-stroke" stroke-width="5"/>

  <!-- Central Modern Sprout & Organic Leaf Emblem -->
  <!-- Left Sprout Leaf -->
  <path d="M 250 245 C 220 230 185 190 195 140 C 235 140 248 190 250 245 Z" class="brand-fill" opacity="0.95"/>
  <!-- Right Sprout Leaf -->
  <path d="M 250 245 C 280 230 315 190 305 140 C 265 140 252 190 250 245 Z" class="brand-fill" opacity="0.8"/>
  <!-- Central Stem & Vein -->
  <line x1="250" y1="140" x2="250" y2="280" class="brand-stroke" stroke-width="4.5" stroke="#ffffff"/>

  <!-- Regenerative Soil Furrows Wave Lines -->
  <path d="M 130 290 Q 250 325 370 290" class="brand-stroke" stroke-width="6"/>
  <path d="M 155 318 Q 250 348 345 318" class="brand-stroke" stroke-width="4.5"/>

  <!-- Modern Clean Typography -->
  <text x="250" y="375" class="brand-text" font-size="34" font-weight="800" letter-spacing="4">VIDABOA</text>
  <text x="250" y="405" class="brand-text" font-size="19" font-weight="600" letter-spacing="7">FARM</text>
  <text x="250" y="432" class="brand-text" font-size="12" font-weight="700" letter-spacing="3" opacity="0.9">EST. 2020 · HIGHVELD</text>
</svg>
